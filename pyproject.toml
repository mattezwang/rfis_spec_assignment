[project]
name = "plant-tracker"
version = "0.1.0"
description = "Shared household plant care tracker for roommates"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0,<4",
]

[project.scripts]
plant-tracker = "plant_tracker.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plant_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
